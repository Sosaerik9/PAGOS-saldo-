<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Móvil</title>
    <style>
        body {
            background-color: #ffffff;
            color: #333333;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #f4f5f7;
            border: 2px solid #ff7700;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-box {
            border: 2px solid #ff7700;
            border-radius: 12px;
            display: inline-block;
            padding: 8px 25px;
            background: #ffffff;
            color: #ff7700;
            font-weight: bold;
            font-size: 16px;
        }
        .section-title {
            color: #ff7700;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-box {
            background: #ffffff; 
            padding: 12px 15px; 
            border-radius: 10px; 
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }
        .bank-data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #333;
        }
        .bank-data-row:last-child {
            margin-bottom: 0;
        }
        .copy-btn {
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: #333;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background-color: #ff7700;
            border-color: #cc6000;
            color: white;
        }
        /* Sección de carga de comprobante */
        .upload-section {
            background: #ffffff;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px dashed #ff7700;
            text-align: center;
        }
        .upload-label {
            font-size: 13px;
            font-weight: bold;
            color: #444;
            display: block;
            margin-bottom: 8px;
        }
        .file-input {
            display: none;
        }
        .file-custom-btn {
            display: inline-block;
            background-color: #fff3e0;
            color: #ff7700;
            border: 1px solid #ff7700;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .file-custom-btn:hover {
            background-color: #ff7700;
            color: white;
        }
        #preview-container {
            margin-top: 10px;
            display: none;
        }
        #preview-img {
            max-width: 100%;
            max-height: 120px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        .file-name {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            word-break: break-all;
        }
        .btn-whatsapp {
            display: block;
            width: 100%;
            background-color: #ff7700;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            box-sizing: border-box;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }
        .btn-whatsapp:hover {
            background-color: #cc6000;
        }
        #toast {
            visibility: hidden;
            min-width: 150px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 8px 12px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 13px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.2);
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo / Título Superior -->
        <div class="logo-container">
            <div class="logo-box">SERVICIO DE PAGOS</div>
        </div>

        <!-- Sección de Datos Bancarios -->
        <div class="section-title">💳 DATOS BANCARIOS PAGO MÓVIL (MERCANTIL)</div>

        <div class="info-box">
            <div class="bank-data-row">
                <span>📞 <strong>Teléfono:</strong> <span id="val-tel">04247284763</span></span>
                <button class="copy-btn" onclick="copiarTexto('val-tel')">Copiar</button>
            </div>
            <div class="bank-data-row">
                <span>🪪 <strong>Cédula:</strong> <span id="val-ced">17455318</span></span>
                <button class="copy-btn" onclick="copiarTexto('val-ced')">Copiar</button>
            </div>
        </div>

        <!-- Sección de Cargar Capture -->
        <div class="upload-section">
            <span class="upload-label">📎 Adjunta tu capture de pago (Opcional)</span>
            <label for="capture-file" class="file-custom-btn">Seleccionar Imagen</label>
            <input type="file" id="capture-file" class="file-input" accept="image/*" onchange="verificarImagen(this)">
            <div id="preview-container">
                <img id="preview-img" src="" alt="Vista previa">
                <div id="file-name" class="file-name"></div>
            </div>
        </div>

        <!-- Botón de envío al WhatsApp administrador -->
        <button onclick="enviarWhatsApp()" class="btn-whatsapp">
            ENVIAR CAPTURA A ADMINISTRADOR<br>
            <span style="font-size: 12px; font-weight: normal;">💬 0424 704 65 11</span>
        </button>
    </div>

    <!-- Notificación pequeña flotante -->
    <div id="toast">¡Copiado al portapapeles!</div>

    <script>
        function copiarTexto(idElemento) {
            const texto = document.getElementById(idElemento).innerText;
            navigator.clipboard.writeText(texto).then(() => {
                mostrarToast("¡Copiado al portapapeles!");
            }).catch(err => {
                console.error("Error al copiar: ", err);
            });
        }

        function verificarImagen(input) {
            const previewContainer = document.getElementById("preview-container");
            const previewImg = document.getElementById("preview-img");
            const fileNameDiv = document.getElementById("file-name");

            if (input.files && input.files[0]) {
                const file = input.files[0];
                fileNameDiv.innerText = file.name;

                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewContainer.style.display = "block";
                }
                reader.readAsDataURL(file);
                mostrarToast("¡Imagen cargada con éxito!");
            }
        }

        functionenviarWhatsApp() {
            const fileInput = document.getElementById("capture-file");
            let mensaje = "Hola, adjunto mi comprobante de pago de Pago Móvil.";
            
            if (fileInput.files && fileInput.files[0]) {
                mensaje += " (Ya seleccioné mi capture en la web, lo enviaré enseguida).";
            }

            const numeroWhatsApp = "584247046511";
            const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        function mostrarToast(texto) {
            const toast = document.getElementById("toast");
            toast.innerText = texto;
            toast.className = "show";
            setTimeout(() => {
                toast.className = toast.className.replace("show", "");
            }, 2500);
        }
    </script>

</body>
</html>
